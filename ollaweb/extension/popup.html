<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>OllaWeb Tailor</title>
    <style>
      body {
        width: 320px;
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0b0f12;
        color: #e2e8f0;
      }
      .wrap {
        padding: 12px;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 8px;
      }
      p {
        font-size: 12px;
        margin: 0 0 8px;
        color: #94a3b8;
      }
      button {
        width: 100%;
        padding: 8px 10px;
        background: #22c55e;
        color: #0b0f12;
        border: 0;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      #status {
        margin-top: 8px;
        font-size: 12px;
        min-height: 16px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>OllaWeb Tailor</h1>
      <p>Scrape this job posting and open OllaWeb to auto-tailor your resume.</p>
      <button id="tailor">Tailor</button>
      <div id="status" role="status" aria-live="polite"></div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
